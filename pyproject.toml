[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "transcript-intel"
version = "0.1.0"
description = "Transcript Intelligence — topic categorisation, sentiment trends and stakeholder insights from call transcripts"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "python-dotenv>=1.0",
    "sentence-transformers>=3.0",
    "umap-learn>=0.5",
]

[project.optional-dependencies]
llm = ["anthropic>=0.125", "pydantic>=2.0"]
dev = ["jupyter", "nbconvert", "pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
